spring.application.name=projetoTds

spring.datasource.url=jdbc:mariadb://localhost:3306/projetoTds_test?createDatabaseIfNotExist=true
spring.datasource.username=root
# MARIADB_SECRET é uma variável de ambiente (ou utiliza o valor depois dos dois pontos)
spring.datasource.password=${MARIADB_SECRET:mariadb}

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# adia a inicialização da execução dos scripts para depois da criação dos EntityManager do JPA
spring.jpa.defer-datasource-initialization=true
# executa os scripts do arquivo data.sql
spring.sql.init.mode=always
# ignora erros ao tentar repopular as tabelas (útil quando ddl-auto=update)
spring.sql.init.continue-on-error=true

api.security.token.secret=${JWT_SECRET:12345678}
